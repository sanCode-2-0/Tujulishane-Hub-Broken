<header id="e" class="border-b border-gray-200 bg-white" x-data="{ headerOpen: false, langOpen: false, accessOpen: false }" @click.away="langOpen = false; accessOpen = false">
  <nav class="mx-auto flex max-w-screen-2xl items-center justify-between gap-x-6 py-4 px-6 sm:px-8 lg:py-5" aria-label="Global">
    <div class="flex items-center overflow-hidden w-auto">
      <a href="index.html" title="Go to the homepage" class="flex-none flex-shrink-0 block p-1 rounded-lg focus:ring-2 focus:outline-none">
        <span class="sr-only">RMNCAH Hub</span>
        <!-- Logo layout -->
        <div class="flex items-center space-x-3">
          <img class="w-auto h-8 2xs:h-12" src="resources/images/logo.png" alt="RMNCAH Logo" onerror="this.src='resources/images/moh.png'">
          <div class="flex flex-col justify-center border-l border-gray-300 pl-3">
            <span class="text-xl font-bold tracking-tight text-gray-900 leading-none">RMNCAH<span class="text-[#0047BA]">Hub</span></span>
            <span class="text-[9px] uppercase tracking-widest text-gray-500 font-semibold leading-none mt-1">Coordination Portal</span>
          </div>
        </div>
      </a>
    </div>

    <!-- Center Navigation Links -->
    <div class="hidden lg:flex lg:gap-x-6 xl:gap-x-12">
      <a href="index.html" class="inline-flex items-center p-1 rounded-lg text-base text-gray-500 hover:text-gray-900 font-medium">
        Home
      </a>
      <a href="faq.html" class="inline-flex items-center p-1 rounded-lg text-base text-gray-500 hover:text-gray-900 font-medium">
        Help &amp; Support
      </a>
    </div>

    <!-- Right-aligned Items (Authentication + Switchers) -->
    <div class="flex items-center justify-end gap-4">
      <!-- Search button (icon only) -->
      <div class="hidden lg:block">
        <a href="projects.html" title="Search Hub" class="text-base text-gray-500 hover:text-gray-900 rounded-full py-1.5 px-2.5 hover:bg-gray-100 block">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"></path>
          </svg>
        </a>
      </div>
      <!-- Auth buttons (Desktop) -->
      <div class="hidden lg:flex xl:items-center xl:space-x-3">
        <a href="access.html?tab=login" class="rounded-3xl whitespace-nowrap border border-transparent text-sm bg-white py-2 px-5 font-semibold text-gray-800 hover:bg-gray-100 focus:outline-none transition">
          Sign in
        </a>
        <a href="access.html?tab=register" class="rounded-3xl whitespace-nowrap border border-transparent text-sm bg-[#0047BA] py-2 px-5 font-semibold text-white shadow-sm hover:bg-[#003da1] focus:outline-none transition">
          Register
        </a>
      </div>

      <!-- Language switch / Accessibility Menu Group -->
      <div class="flex items-center justify-center space-x-3 2xs:space-x-4">

        <!-- Accessibility Options Dropdown -->
        <div class="relative self-center">
          <button @click="accessOpen = !accessOpen; langOpen = false" type="button" class="p-px h-auto flex items-center justify-center rounded-full focus:outline-none focus:ring-1 focus:ring-[#3482FF]" aria-label="Accessibility Settings">
            <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 22 23">
              <rect width="22" height="22" y=".5" fill="#3482FF" rx="11"></rect>
              <g fill="#fff">
                <path d="M9.94 8.456 5.9 6.943a.662.662 0 0 0-.52.023.693.693 0 0 0-.352.395.719.719 0 0 0 .023.535.688.688 0 0 0 .383.362l3.25 1.218a.878.878 0 0 1 .417.329.919.919 0 0 1 .158.516v1.986c0 .27-.05.536-.148.786l-1.744 4.445a.718.718 0 0 0 .15.767.678.678 0 0 0 .485.201.666.666 0 0 0 .481-.213.702.702 0 0 0 .144-.23l1.57-3.999a.865.865 0 0 1 1.62 0l1.57 3.998c.069.17.2.306.365.377a.662.662 0 0 0 .517.003.69.69 0 0 0 .37-.372.72.72 0 0 0 .009-.532l-1.743-4.442a2.155 2.155 0 0 1-.149-.786v-1.99a.9.9 0 0 1 .575-.845l3.25-1.218a.688.688 0 0 0 .384-.362.72.72 0 0 0 .023-.535.693.693 0 0 0-.352-.395.662.662 0 0 0-.52-.024l-4.04 1.514a2.456 2.456 0 0 1-2.137 0Z"></path>
                <path d="M9.454 6.1c0 .298.08.59.233.844.153.253.372.458.631.59l.191.072c.322.12.675.12.997 0l.191-.072a1.57 1.57 0 0 0 .61-.558 1.632 1.632 0 0 0-.48-2.235 1.522 1.522 0 0 0-1.575-.039 1.576 1.576 0 0 0-.584.587 1.64 1.64 0 0 0-.214.81Z"></path>
              </g>
            </svg>
          </button>
          <div x-cloak x-show="accessOpen" x-transition class="absolute right-0 z-40 mt-2 w-56 origin-top-right rounded-md bg-white shadow-lg border border-gray-200 focus:outline-none">
            <div class="py-1 divide-y divide-gray-100 text-left">
              <p class="text-gray-700 font-semibold px-4 py-2.5 text-sm">
                Accessibility
              </p>
              <label for="high-contrast-btn" class="text-gray-700 flex items-center gap-2 px-4 py-2.5 text-sm hover:bg-gray-50 cursor-pointer">
                <input class="h-4 w-4 rounded border-gray-300 text-[#0047BA] focus:ring-[#0047BA]" type="checkbox" id="high-contrast-btn">
                <span>High Contrast</span>
              </label>
              <label for="negative-contrast-btn" class="text-gray-700 flex items-center gap-2 px-4 py-2.5 text-sm hover:bg-gray-50 cursor-pointer">
                <input class="h-4 w-4 rounded border-gray-300 text-[#0047BA] focus:ring-[#0047BA]" type="checkbox" id="negative-contrast-btn">
                <span>Negative Contrast</span>
              </label>
              <label for="grayscale-btn" class="text-gray-700 flex items-center gap-2 px-4 py-2.5 text-sm hover:bg-gray-50 cursor-pointer">
                <input class="h-4 w-4 rounded border-gray-300 text-[#0047BA] focus:ring-[#0047BA]" type="checkbox" id="grayscale-btn">
                <span>Grayscale</span>
              </label>
              <button class="text-gray-900 w-full flex items-center gap-2 px-4 py-2.5 text-sm hover:bg-gray-50 text-left" id="increaseBtn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607zM10.5 7.5v6m3-3h-6"></path>
                </svg>
                <span>Increase Text</span>
              </button>
              <button class="text-gray-900 w-full flex items-center gap-2 px-4 py-2.5 text-sm hover:bg-gray-50 text-left" id="decreaseBtn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607zM13.5 10.5h-6"></path>
                </svg>
                <span>Decrease Text</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Mobile hamburger menu -->
        <button @click="headerOpen = !headerOpen" type="button" class="inline-flex lg:hidden items-center justify-center text-gray-700" aria-label="Open mobile menu">
          <span class="sr-only">Open mobile menu</span>
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"></path>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Mobile menu modal -->
  <div x-cloak x-show="headerOpen" class="block lg:hidden" role="dialog" aria-modal="true">
    <div class="fixed inset-0 z-30 bg-gray-50/10 backdrop-blur-sm backdrop-filter"></div>
    <div class="fixed inset-y-0 right-0 z-30 w-full overflow-y-auto bg-white py-4 px-6 sm:max-w-sm sm:ring-1 sm:ring-gray-900/10">
      <div class="flex items-center gap-x-6">
        <a href="index.html">
          <img class="w-auto h-8" src="resources/images/logo.png" alt="logo" onerror="this.src='resources/images/moh.png'">
        </a>
        <button @click="headerOpen = false" type="button" class="ml-auto -m-2.5 rounded-md p-2.5 text-gray-700" aria-label="Close mobile menu">
          <span class="sr-only">Close mobile menu</span>
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="mt-6 flow-root">
        <div class="mb-6 divide-y divide-gray-500/10">
          <div class="space-y-1 py-2.5">
            <a href="index.html" class="-mx-3 block rounded-lg py-1.5 px-3 text-base font-semibold leading-7 text-gray-900 hover:bg-gray-50">
              Home
            </a>
            <a href="faq.html" class="-mx-3 block rounded-lg py-1.5 px-3 text-base font-semibold leading-7 text-gray-900 hover:bg-gray-50">
              Help &amp; Support
            </a>
            <div class="pt-4 pb-3 border-t border-gray-200">
              <div class="flex space-x-4 items-center justify-start">
                <a href="access.html?tab=login" class="block w-full text-center rounded-3xl border border-gray-200 bg-white py-2 px-4 font-semibold text-gray-800 shadow-sm hover:bg-gray-100">
                  Sign in
                </a>
                <a href="access.html?tab=register" class="block w-full text-center rounded-3xl border border-transparent bg-[#0047BA] py-2 px-4 font-semibold text-white shadow-sm hover:bg-[#003da1]">
                  Register
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
<!-- Load accessibility script -->
<script src="styles/accessibility-helper.js" defer></script>
