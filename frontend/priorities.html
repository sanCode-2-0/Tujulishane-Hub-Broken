    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script src="https://api.tiles.mapbox.com/mapbox-gl-js/v2.9.1/mapbox-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

  <!-- Backend URL Configuration - MUST BE LOADED FIRST -->
  <script>
    if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.hostname === "") {
      document.write('<script src="./config.local.js"><\/script>');

  </script>
  <script src="./app-config.js?v=5"></script>
  <script src="./set-base-url.js?v=3"></script>

  <!-- Modal Utilities -->
  <script src="./modal-utils.js"></script>

  <!-- Authentication utilities -->
  <script type="module">
    // Use window.BASE_URL which is already set by app-config.js loaded via script tag
    const BASE_URL = window.BASE_URL;
    console.log(
      "[priorities.html] Using BASE_URL:",
      BASE_URL,
      "- Environment:",
      window.USE_PROD ? "PRODUCTION" : "DEVELOPMENT"
    );
  </script>
  <script src="auth.js"></script>
  <!-- Project Status Filter Utility -->
  <script src="./src/utils/project-status-filter.js"></script>

  <!-- Optional: Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tw-elements/css/tw-elements.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#272E28",
            secondary: "#f59e0b",
            accent: "#00474C",
            button: "#14B04C",
            button_two: "#3482FF",
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
          },
        },
      },
    };
  </script>
  <style>
    .map-marker-wrapper {
      width: 0;
      height: 0;
      overflow: visible;
      cursor: pointer;
    }
    .map-marker-pin {
      position: absolute;
      left: -12px;
      top: -34px;
      font-size: 28px;
      line-height: 1;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35));
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .map-marker-wrapper:hover .map-marker-pin {
      transform: scale(1.2);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.45));
    }
    .map-marker-pin.marker-dimmed { opacity: 0.3; }
    .map-marker-pin.marker-selected { transform: scale(1.3) !important; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)) !important; }
    @keyframes markerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .map-marker-pin.marker-active { animation: markerPulse 1.8s ease-in-out infinite; }

    .fade-slide-enter {
      opacity: 0;
      transform: translateY(20px);
    }

    .fade-slide-enter-active {
      opacity: 1;
      transform: translateY(0);
      transition: all 0.4s ease;
    }

    .fade-slide-leave {
      opacity: 1;
      transform: translateY(0);
    }

    .fade-slide-leave-active {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
    }
  </style>
</head>

<body x-data="announcementsApp()" x-init="init()" class="text-gray-800">
  <!-- Authentication Check -->
  <script>
    // Check authentication on page load
    (function () {
      const token =
        localStorage.getItem("accessToken") || localStorage.getItem("token");
      if (!token) {
        console.warn(
          "[Security] No authentication token found, redirecting to login"
        );
        window.location.href = "index.html";
        return;
      }

      // Verify token format (JWT should have 3 parts)
      const parts = token.split(".");
      if (parts.length !== 3) {
        console.warn("[Security] Invalid token format, redirecting to login");
        localStorage.removeItem("accessToken");
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "index.html";
        return;
      }

      console.log("[Security] Authentication check passed");
    })();
  </script>
  <script>
    window.announcementsApp = function announcementsApp() {
      return {
        announcements: [],
        myProjects: [],
        organizations: [],
        myCollaborationRequests: [], // Track user's submitted requests
        chatMessages: [],
        sendingMessage: false,
        newMessage: "",
        searchText: "",
        filterStatus: "",
        sortOrder: "NEWEST",
        activeSlide: 0,
        media: [
          { type: 'image', src: 'resources/images/main-1.jpg' },
          { type: 'image', src: 'resources/images/main-2.jpg' },
          { type: 'image', src: 'resources/images/main-3.jpg' }
        ],
        loading: true,
        creating: false,
        submitting: false,
        showCreateModal: false,
        showDetailsModal: false,
        showRequestModal: false,
        selectedAnnouncement: null,
        userRole: null, // Will be set in init from user object
        currentUser: null, // Store current user data including email
        newAnnouncement: {
          projectId: "",
          title: "",
          content: "",
          deadline: "",
        },
        collaborationRequest: {
          organizationId: "",
          proposedContribution: "",
        },

        async init() {
          // Wait for auth.js to load user data and get it directly
          const user = await this.waitForAuth();

          // Set user role and store user data from the returned user object
          if (user && user.role) {
            this.userRole = user.role;
            this.currentUser = user; // Store full user object
          } else {
            // Fallback: try to read from localStorage
            const userStr = localStorage.getItem("currentUser");
            if (userStr) {
              try {
                const parsedUser = JSON.parse(userStr);
                this.userRole = parsedUser.role;
                this.currentUser = parsedUser;
              } catch (e) {
                console.error("Error parsing user data:", e);
              }
            }
            // Final fallback to userRole if it exists
            if (!this.userRole) {
              this.userRole = localStorage.getItem("userRole");
            }
          }
          console.log("🔍 User Role:", this.userRole); // Debug log
          console.log("🔍 Current User:", this.currentUser); // Debug log

          // Populate user dropdown in navigation
          if (this.currentUser) {
            console.log("👤 Populating user dropdown...");
            this.populateUserDropdown(this.currentUser);
          }

          await this.loadAnnouncements();

          const token = localStorage.getItem("accessToken");
          if (token) {
            await this.loadOrganizations();
            // my-projects and my-requests are PARTNER-only endpoints
            if (this.userRole === "PARTNER" || this.userRole === "USER") {
              await this.loadMyProjects();
              await this.loadMyCollaborationRequests();
            }
          } else {
            console.warn("⚠️ No access token found, skipping project load");
          }
        },

        // Populate user dropdown with current user data
        populateUserDropdown(user) {
          try {
            const userDisplayName =
              document.getElementById("userDisplayName");
            const userNameDisplay =
              document.getElementById("userNameDisplay");
            const userEmailDisplay =
              document.getElementById("userEmailDisplay");
            const userRoleDisplay =
              document.getElementById("userRoleDisplay");
            const userStatusDisplay =
              document.getElementById("userStatusDisplay");

            if (userDisplayName)
              userDisplayName.textContent = user.name || "User";
            if (userNameDisplay)
              userNameDisplay.textContent = user.name || "Loading...";
            if (userEmailDisplay)
              userEmailDisplay.textContent = user.email || "";
            if (userRoleDisplay)
              userRoleDisplay.textContent = user.role || "N/A";
            if (userStatusDisplay) {
              userStatusDisplay.textContent = user.status || "N/A";
              // Update status color based on status
              userStatusDisplay.className =
                user.status === "ACTIVE"
                  ? "font-medium text-green-600"
                  : "font-medium text-gray-600";
            }

            // Show role-based navs
            if (
              user.role === "ADMIN" ||
              user.role === "SUPER_ADMIN" ||
              user.role === "SUPER_ADMIN_REVIEWER" ||
              user.role === "SUPER_ADMIN_APPROVER" ||
              user.role === "SUPER_ADMIN_REVIEWER" ||
              user.role === "SUPER_ADMIN_APPROVER"
            ) {
              const adminNav = document.getElementById("adminNav");
              if (adminNav) adminNav.classList.remove("hidden");
            }
            if (user.role === "DONOR") {
              const donorNav = document.getElementById("donorNav");
              if (donorNav) donorNav.classList.remove("hidden");
            }

            console.log("✅ User dropdown populated successfully!");
          } catch (error) {
            console.error("❌ Error populating user dropdown:", error);
          }
        },

        async waitForAuth() {
          // Wait for AuthManager to be available and initialized
          let attempts = 0;
          while (attempts < 50) {
            // Max 5 seconds
            if (
              window.authManager &&
              typeof window.authManager.getCurrentUser === "function"
            ) {
              // Try to get current user and return it directly
              try {
                const user = await window.authManager.getCurrentUser();
                return user; // Return the user object
              } catch (e) {
                // User not logged in or error
                return null;
              }
            }
            await new Promise((resolve) => setTimeout(resolve, 100));
            attempts++;
          }
          return null; // Timeout - no auth available
        },

        async loadAnnouncements() {
          try {
            const response = await fetch(
              `${window.BASE_URL}/api/announcements`
            );
            const data = await response.json();
            if (data.status === 200) {
              this.announcements = data.data;
            }
          } catch (error) {
            console.error("Error loading announcements:", error);
            await showAlert("Failed to load announcements", "Error", "error");
          } finally {
            this.loading = false;
          }
        },

        async loadMyProjects() {
          try {
            const token = localStorage.getItem("accessToken");
            console.log(
              "🔍 Loading my projects with token:",
              token ? "Present" : "Missing"
            );

            const response = await fetch(
              `${window.BASE_URL}/api/projects/my-projects`,
              {
                headers: { Authorization: `Bearer ${token}` },
              }
            );

            console.log("🔍 My projects response status:", response.status);

            if (!response.ok) {
              console.error(
                "❌ Failed to load projects. Status:",
                response.status
              );
              if (response.status === 403) {
                console.error(
                  "❌ 403 Forbidden - You may not have PARTNER role"
                );
              } else if (response.status === 401) {
                console.error(
                  "❌ 401 Unauthorized - Token may be invalid or expired"
                );
              }
              this.myProjects = [];
              return;
            }

            const data = await response.json();
            console.log("🔍 My projects response data:", data);

            if (data.status === 200) {
              this.myProjects = data.data || [];
              console.log(
                "✅ Loaded projects:",
                this.myProjects.length,
                "projects"
              );
              console.log("📋 Projects:", this.myProjects);
            } else {
              console.warn("⚠️ Unexpected response status:", data.status);
              this.myProjects = [];
            }
          } catch (error) {
            console.error("❌ Error loading projects:", error);
            this.myProjects = [];
          }
        },

        async loadOrganizations() {
          try {
            const token = localStorage.getItem("accessToken");
            const response = await fetch(
              `${window.BASE_URL}/api/organizations`,
              {
                headers: { Authorization: `Bearer ${token}` },
              }
            );

            // Check if response is OK before parsing JSON
            if (!response.ok) {
              // Silently handle 403 - organizations endpoint may be restricted
              this.organizations = []; // Set empty array
              return;
            }

            const data = await response.json();
            if (data.status === 200) {
              this.organizations = data.data;
            }
          } catch (error) {
            // Silently handle errors - organizations are optional
            this.organizations = []; // Set empty array on error
          }
        },

        async loadMyCollaborationRequests() {
          try {
            const token = localStorage.getItem("accessToken");
            const response = await fetch(
              `${window.BASE_URL}/api/collaboration-requests/my-requests`,
              {
                headers: { Authorization: `Bearer ${token}` },
              }
            );

            if (!response.ok) {
              console.warn(
                "Could not load collaboration requests:",
                response.status
              );
              this.myCollaborationRequests = [];
              return;
            }

            const data = await response.json();
            if (data.status === 200) {
              this.myCollaborationRequests = data.data || [];
              console.log(
                "✅ Loaded collaboration requests:",
                this.myCollaborationRequests.length
              );
            } else {
              this.myCollaborationRequests = [];
            }
          } catch (error) {
            console.error("Error loading collaboration requests:", error);
            this.myCollaborationRequests = [];
          }
        },

        async createAnnouncement() {
          this.creating = true;
          try {
            const token = localStorage.getItem("accessToken");
            const response = await fetch(
              `${window.BASE_URL}/api/announcements`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${token}`,
                },
                body: JSON.stringify(this.newAnnouncement),
              }
            );

            // Check if response is OK before parsing JSON
            if (!response.ok) {
              if (response.status === 403) {
                await showAlert(
                  "Permission denied. You may not have access to create announcements.",
                  "Permission Denied",
                  "error"
                );
              } else if (response.status === 401) {
                await showAlert(
                  "You must be logged in to create announcements.",
                  "Authentication Required",
                  "warning"
                );
              } else {
                await showAlert(
                  `Error: Server returned status ${response.status}`,
                  "Error",
                  "error"
                );
              }
              return;
            }

            const data = await response.json();

            if (data.status === 201) {
              await showAlert(
                "Announcement created successfully!",
                "Success",
                "success"
              );
              this.showCreateModal = false;
              this.newAnnouncement = {
                projectId: "",
                title: "",
                content: "",
                deadline: "",
              };
              await this.loadAnnouncements();
            } else {
              await showAlert(
                "Error: " + (data.message || "Unknown error occurred"),
                "Error",
                "error"
              );
            }
          } catch (error) {
            console.error("Error creating announcement:", error);
            await showAlert(
              "Failed to create announcement. Please try again.",
              "Error",
              "error"
            );
          } finally {
            this.creating = false;
          }
        },

        viewDetails(announcement) {
          this.selectedAnnouncement = announcement;
          this.showDetailsModal = true;
          this.loadChatMessages(announcement.id);
        },

        requestCollaboration(announcement) {
          this.selectedAnnouncement = announcement;
          this.showRequestModal = true;
          this.showDetailsModal = false;
        },

        async submitRequest() {
          this.submitting = true;
          try {
            const token = localStorage.getItem("accessToken");

            // Prepare request payload - only include organizationId if it's not empty
            const payload = {
              proposedContribution:
                this.collaborationRequest.proposedContribution,
            };

            // Only add organizationId if it's set (not empty string)
            if (this.collaborationRequest.organizationId) {
              payload.organizationId = parseInt(
                this.collaborationRequest.organizationId
              );
            }

            const response = await fetch(
              `${window.BASE_URL}/api/collaboration-requests/announcements/${this.selectedAnnouncement.id}`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${token}`,
                },
                body: JSON.stringify(payload),
              }
            );

            // Always try to parse JSON to get the error message
            const data = await response.json();

            // Check if response is OK
            if (!response.ok) {
              if (response.status === 403) {
                await showAlert(
                  "Permission denied: " +
                  (data.message ||
                    "You may not have access to submit collaboration requests."),
                  "Permission Denied",
                  "error"
                );
              } else if (response.status === 401) {
                await showAlert(
                  "Authentication required: " +
                  (data.message ||
                    "You must be logged in to submit a collaboration request."),
                  "Authentication Required",
                  "warning"
                );
              } else if (response.status === 400) {
                await showAlert(
                  "Invalid request: " +
                  (data.message ||
                    "Please check your input and try again."),
                  "Invalid Request",
                  "error"
                );
              } else {
                await showAlert(
                  `Error: ${data.message ||
                  "Server returned status " + response.status
                  }`,
                  "Error",
                  "error"
                );
              }
              return;
            }

            if (data.status === 201) {
              await showAlert(
                "Collaboration request submitted successfully! The Ministry of Health will review your request.",
                "Success",
                "success"
              );
              this.showRequestModal = false;
              this.collaborationRequest = {
                organizationId: "",
                proposedContribution: "",
              };
              // Reload collaboration requests to update the UI
              await this.loadMyCollaborationRequests();
            } else {
              await showAlert(
                "Error: " + (data.message || "Unknown error occurred"),
                "Error",
                "error"
              );
            }
          } catch (error) {
            console.error("Error submitting request:", error);
            await showAlert(
              "Failed to submit collaboration request. Please try again.",
              "Error",
              "error"
            );
          } finally {
            this.submitting = false;
          }
        },

        // Helper method to check if announcement was created by current user
        isOwnAnnouncement(announcement) {
          if (!this.currentUser || !announcement || !announcement.createdBy) {
            console.log("🔍 isOwnAnnouncement: Missing data", {
              hasCurrentUser: !!this.currentUser,
              hasAnnouncement: !!announcement,
              hasCreatedBy: !!(announcement && announcement.createdBy),
            });
            return false;
          }
          // Compare by email as it's unique
          const isOwn =
            this.currentUser.email === announcement.createdBy.email;
          console.log("🔍 isOwnAnnouncement:", {
            currentUserEmail: this.currentUser.email,
            createdByEmail: announcement.createdBy.email,
            isOwn: isOwn,
          });
          return isOwn;
        },

        // Helper method to check if user has already requested collaboration for this announcement
        hasAlreadyRequested(announcement) {
          if (!announcement || !this.myCollaborationRequests) {
            return false;
          }

          const hasRequested = this.myCollaborationRequests.some(
            (request) =>
              request.announcement &&
              request.announcement.id === announcement.id
          );

          console.log("🔍 hasAlreadyRequested:", {
            announcementId: announcement.id,
            totalRequests: this.myCollaborationRequests.length,
            hasRequested: hasRequested,
          });

          return hasRequested;
        },

        isDeadlineImminent(deadline) {
          if (!deadline) return false;
          const now = new Date();
          const deadlineDate = new Date(deadline);
          const diffTime = deadlineDate - now;
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
          return diffDays <= 7 && diffDays >= 0; // Imminent if within 7 days and not past
        },

        async loadChatMessages(announcementId) {
          try {
            const token = localStorage.getItem("accessToken");
            const response = await fetch(`${window.BASE_URL}/api/announcements/${announcementId}/messages`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            if (response.ok) {
              const data = await response.json();
              this.chatMessages = data.data || [];
            }
          } catch (error) {
            console.error("Error loading chat messages:", error);
          }
        },

        async sendMessage() {
          if (!this.newMessage.trim()) return;
          this.sendingMessage = true;
          try {
            const token = localStorage.getItem("accessToken");
            const response = await fetch(`${window.BASE_URL}/api/announcements/${this.selectedAnnouncement.id}/messages`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify({ message: this.newMessage })
            });
            if (response.ok) {
              this.newMessage = "";
              await this.loadChatMessages(this.selectedAnnouncement.id);
            } else {
              await showAlert("Failed to send message", "Error", "error");
            }
          } catch (error) {
            console.error("Error sending message:", error);
            await showAlert("Failed to send message", "Error", "error");
          } finally {
            this.sendingMessage = false;
          }
        },

        async editMessage(msg) {
          const newMessage = prompt("Edit message:", msg.message);
          if (newMessage && newMessage.trim() && newMessage !== msg.message) {
            try {
              const token = localStorage.getItem("accessToken");
              const response = await fetch(`${window.BASE_URL}/api/announcements/${this.selectedAnnouncement.id}/messages/${msg.id}`, {
                method: "PUT",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${token}`
                },
                body: JSON.stringify({ message: newMessage })
              });
              if (response.ok) {
                await this.loadChatMessages(this.selectedAnnouncement.id);
              } else {
                await showAlert("Failed to edit message", "Error", "error");
              }
            } catch (error) {
              console.error("Error editing message:", error);
              await showAlert("Failed to edit message", "Error", "error");
            }
          }
        },

        async deleteMessage(msg) {
          if (confirm("Are you sure you want to delete this message?")) {
            try {
              const token = localStorage.getItem("accessToken");
              const response = await fetch(`${window.BASE_URL}/api/announcements/${this.selectedAnnouncement.id}/messages/${msg.id}`, {
                method: "DELETE",
                headers: {
                  Authorization: `Bearer ${token}`
                }
              });
              if (response.ok) {
                await this.loadChatMessages(this.selectedAnnouncement.id);
              } else {
                await showAlert("Failed to delete message", "Error", "error");
              }
            } catch (error) {
              console.error("Error deleting message:", error);
              await showAlert("Failed to delete message", "Error", "error");
            }
          }
        },
      };
    };
  </script>
  <div class="" id="nav-placeholder"></div>

  <section class="relative z-0 overflow-hidden" id="top">
    <div class="w-full overflow-hidden">
      <div x-data="{
						activeSlide: 0,
						media: [
						{ type: 'image', src: 'resources/images/main-1.jpg' },
						{ type: 'image', src: 'resources/images/main-2.jpg' },
						{ type: 'image', src: 'resources/images/main-3.jpg' }
						]
					}" x-init="setInterval(() => { activeSlide = (activeSlide + 1) % media.length }, 7000)"

    // Load projects and add to map
    async function loadProjectsForMap() {
      try {
        const response = await fetch(
          `${window.BASE_URL}/api/projects/all`,
          {
            headers: {
              Authorization: `Bearer ${authManager.getToken()}`,
            },
          }
        );

        if (response.ok) {
          const data = await response.json();
          console.log("Raw API response (all projects):", data);
          // Handle API response structure: { status: 200, data: [...], message: "..." }
          let projectsData = [];
          if (data.status === 200 && data.data) {
            projectsData = Array.isArray(data.data) ? data.data : [];
          } else if (Array.isArray(data)) {
            projectsData = data;
          }

          console.log("Loaded all projects:", projectsData.length);
          console.log("All projects data:", projectsData);

          // Log each project's coordinates
          projectsData.forEach((project, idx) => {
            console.log(`Map Project ${idx + 1}:`, {
              name: project.projectName || project.name,
              latitude: project.latitude,
              longitude: project.longitude,
              hasCoordinates: !!(project.latitude && project.longitude),
            });
          });

          // Filter to show only priority projects posted by admin accounts
          // Check both isPriority field and projectCategory field, and creator role
          const priorityProjects = projectsData.filter(project =>
            (project.isPriority === true || project.projectCategory === 'PRIORITY')
          );
          console.log(`Filtered to ${priorityProjects.length} priority projects out of ${projectsData.length} total projects`);

          // Store priority projects globally for display
          projects = priorityProjects;

          // Populate county filter dropdown

          // Add markers to map

            "Adding markers to map for",
            priorityProjects.length,
            "priority projects"
          );
          addMarkersToMap(priorityProjects);

          // Display projects in the UI
          updateFeaturedProject(priorityProjects);
          applyFilters();
        } else {
          console.warn("API response not OK, loading sample projects");
          loadSampleProjects();
        }
      } catch (error) {
        console.error("Error loading projects for map:", error);
        // Use sample data for demo
        loadSampleProjects();
      }

    // Update featured project section
    function updateFeaturedProject(projectsData) {
      const featuredSection = document.getElementById(
        "featuredProjectSection"

      // Find the first priority project or any project if no priority projects exist
      const priorityProject =
        projectsData.find((p) => p.projectCategory === "PRIORITY") ||
        projectsData[0];

      if (!priorityProject) {
        featuredSection.innerHTML = `
            <h4 class="text-lg font-semibold text-gray-800 mb-2">
              No Projects Available

          const marker = new mapboxgl.Marker(el)

          try {

                    /loc\.neighborhood|\bloc\.locality|\bloc\.place|\bloc\.region|\bloc\.address/g,
                    (match) => {
                      const prop = match.split(".")[1];
                      return loc[prop] || "N/A";
                    }
                  );
                  popup.setHTML(updatedPopupHtml);
                }
              }
            }
          });

          mapMarkers.push(marker);
        });

    // Get detailed location info from coordinates using Mapbox Geocoding API
    async function getDetailedLocationFromCoordinates(longitude, latitude) {
      try {
        const response = await fetch(
          `https://api.mapbox.com/geocoding/v5/mapbox.places/${longitude},${latitude}.json?types=address,poi,neighborhood,locality,place,region,country&access_token=${mapboxgl.accessToken}`
        );
        const data = await response.json();
        console.log(
          `Mapbox API response for [${longitude}, ${latitude}]:`,
          data
        );
        if (data.features && data.features.length > 0) {
          const feature = data.features[0];
          const context = feature.context || [];

          // Extract different location components
          const locationInfo = {
            address: feature.place_name,
            neighborhood: null,
            locality: null,
            place: null,
            region: null,
            country: null,
          };

          // Parse context for detailed information
          context.forEach((ctx) => {
            if (ctx.id.startsWith("neighborhood.")) {
              locationInfo.neighborhood = ctx.text;
            } else if (ctx.id.startsWith("locality.")) {
              locationInfo.locality = ctx.text;
            } else if (ctx.id.startsWith("place.")) {
              locationInfo.place = ctx.text;
            } else if (ctx.id.startsWith("region.")) {
              locationInfo.region = ctx.text;
            } else if (ctx.id.startsWith("country.")) {
              locationInfo.country = ctx.text;
            }
          });

          console.log(`Parsed location info:`, locationInfo);
          return locationInfo;
        }
      } catch (error) {
        console.error(
          "Error getting detailed location from coordinates:",
          error
        );
      }
      return null;
    }

    // Get county name from coordinates using Mapbox Geocoding API
    async function getCountyFromCoordinates(longitude, latitude) {
      try {
        const response = await fetch(
          `https://api.mapbox.com/geocoding/v5/mapbox.places/${longitude},${latitude}.json?types=region&access_token=${mapboxgl.accessToken}`
        );
        const data = await response.json();
        if (data.features && data.features.length > 0) {
          return data.features[0].text;
        }
      } catch (error) {
        console.error("Error getting county from coordinates:", error);
      }
      return null;
    }

      projects.forEach((project) => {
        if (project.county) {
          counties.add(project.county);
        } else if (project.region) {
          counties.add(project.region);
        } else if (Array.isArray(project.locations)) {
          project.locations.forEach((loc) => {
            if (loc.county) counties.add(loc.county);
          });
        }
      });

      // Sort counties alphabetically
      const sortedCounties = Array.from(counties).sort();

      // Clear existing options except "All Counties"
      countySelect.innerHTML = '<option value="all">All Counties</option>';

      // Add county options
      sortedCounties.forEach((county) => {
        const option = document.createElement("option");
        option.value = county;
        option.textContent = county;
        countySelect.appendChild(option);
      });
    }

    // Apply all filters and display results
    function applyFilters() {
      console.log("Applying filters:", {
        search: searchQuery,
        county: countyFilter,
        theme: themeFilter,
        status: statusFilter,
        sortBy,
        sortOrder,
      });

      const accordion = document.getElementById("projectAccordion");
      const infoBox = document.getElementById("projectInfo");
      if (infoBox) {
        infoBox.classList.add("hidden");
      }
      if (!accordion) {
        console.error("projectAccordion element not found");
        return;
      }
      accordion.innerHTML = "";
      accordion.classList.remove("hidden");
      accordion.classList.add("opacity-0", "translate-y-4");

      // Apply all filters
      let filtered = projects.filter((project) => {
        // Search filter
        if (searchQuery) {
          const projectName = (
            project.projectName ||
            project.title ||
            ""
          ).toLowerCase();
          if (!projectName.includes(searchQuery)) {
            return false;
          }
        }

        // County filter
        if (countyFilter !== "all") {
          let hasCounty = false;
          if (
            project.county === countyFilter ||
            project.region === countyFilter
          ) {
            hasCounty = true;
          } else if (Array.isArray(project.locations)) {
            hasCounty = project.locations.some(
              (loc) => loc.county === countyFilter
            );
          }
          if (!hasCounty) return false;
        }

        // Theme filter
        if (themeFilter !== "all") {
          const projectTheme = project.projectTheme || project.theme;
          if (projectTheme !== themeFilter) {
            return false;
          }
        }

        // Status filter
        if (statusFilter !== "all") {
          if (project.status?.toLowerCase() !== statusFilter.toLowerCase()) {
            return false;
          }
        }

        return true;
      });

      console.log(
        `Filtered ${filtered.length} projects from ${projects.length} total`
      );

      // Sort projects
      filtered.sort((a, b) => {
        let aVal, bVal;

        if (sortBy === "name") {
          aVal = (a.projectName || a.title || "").toLowerCase();
          bVal = (b.projectName || b.title || "").toLowerCase();
        } else if (sortBy === "date") {
          aVal = new Date(a.startDate || 0);
          bVal = new Date(b.startDate || 0);
        } else if (sortBy === "budget") {
          aVal = parseFloat(a.budget) || 0;
          bVal = parseFloat(b.budget) || 0;
        }

        if (sortOrder === "asc") {
          return aVal > bVal ? 1 : -1;
        } else {
          return aVal < bVal ? 1 : -1;
        }
      });

      // Pagination
      const totalPages = Math.ceil(filtered.length / itemsPerPage);
      const paginated = filtered.slice(
        (currentPage - 1) * itemsPerPage,
        currentPage * itemsPerPage

        ) {

            .map((loc) => loc.county)

            .filter((v, i, arr) => arr.indexOf(v) === i); // unique

			`;
    }

    function focusMarker(index) {
      if (projects[index]) {
        focusMarkerByProjectId(projects[index].id);
      }
    }

    // Focus marker by project ID (handles projects with multiple locations)
    function focusMarkerByProjectId(projectId) {
      const project = projects.find((p) => p.id === projectId);
      if (!project) {
        console.warn("Project not found:", projectId);
        return;
      }

      // Find first marker for this project
      const marker = mapMarkers.find(
        (m) => m.data && m.data.id === projectId
      );
      if (marker) {
        const lngLat = marker.getLngLat();
        map.flyTo({
          center: [lngLat.lng, lngLat.lat],
          zoom: 12,
        });
        marker.togglePopup();
        document
          .getElementById("localMap")
          .scrollIntoView({ behavior: "smooth" });
      } else {
        console.warn("No marker found for project:", projectId);
      }
    }

    function updatePaginationControls(totalPages) {
      const container = document.getElementById("paginationControls");
      if (!container) return;

      container.innerHTML = "";

      if (totalPages <= 1) return; // Don't show pagination for single page

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        btn.className = `px-3 py-1 rounded ${i === currentPage
            ? "bg-blue-600 text-white"
            : "bg-gray-100 text-gray-800 hover:bg-gray-200"
          }`;
        btn.onclick = () => {
          currentPage = i;
          applyFilters();
          // Scroll to top of project list
          document
            .getElementById("projectAccordion")
            .scrollIntoView({ behavior: "smooth" });
        };
        container.appendChild(btn);
      }
    }

    function exportCSV() {
      const headers = [
        "Name",
        "Description",
        "Region",
        "Budget",
        "Status",
        "Start Date",
      ];
      const rows = projects
        .filter((p) => {
          if (
            searchQuery &&
            !p.projectName?.toLowerCase().includes(searchQuery.toLowerCase())
          )
            return false;
          const date = new Date(p.startDate);
          if (dateRangeFrom && date < dateRangeFrom) return false;
          if (dateRangeTo && date > dateRangeTo) return false;
          if (
            currentFilter !== "all" &&
            p.status?.toLowerCase() !== currentFilter
          )
            return false;
          return true;
        })
        .map((p) => [
          p.projectName || "",
          (p.description || "").replace(/,/g, ";"),
          p.region || p.county || "",
          p.budget || "",
          p.status || "",
          p.startDate ? new Date(p.startDate).toLocaleDateString() : "",
        ]);

      let csvContent = [headers.join(",")];
      rows.forEach((r) =>
        csvContent.push(r.map((val) => `"${val}"`).join(","))
      );

      const blob = new Blob([csvContent.join("\n")], { type: "text/csv" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `projects_${new Date().toISOString().split("T")[0]
        }.csv`;
      link.click();
    }

    // Initialize new project modal map
    let newProjectMap;
    let newProjectMarker;

    function initializeNewProjectMap() {
      if (newProjectMap) return; // Already initialized

      const container = document.getElementById("newProjectMap");
      if (!container) {
        console.warn("Map container not found");
        return;
      }

      try {
        console.log("Initializing new project map...");
        newProjectMap = new mapboxgl.Map({
          container: "newProjectMap",
          style: "mapbox://styles/mapbox/streets-v11",
          center: [37.9062, -0.0236], // Center on Kenya
          zoom: 6,
        });

        newProjectMap.addControl(new mapboxgl.NavigationControl());

        // Add click handler for location selection
        newProjectMap.on("click", async (e) => {
          const lng = e.lngLat.lng;
          const lat = e.lngLat.lat;

          // Update hidden inputs
          document.getElementById("project_latitude").value = lat;
          document.getElementById("project_longitude").value = lng;

          // Update display
          const latLngDisplay = document.getElementById("selectedLatLng");
          if (latLngDisplay) {
            latLngDisplay.textContent = `${lat.toFixed(6)}, ${lng.toFixed(
              6
            )}`;
          }

          // Get county from coordinates
          try {
            const county = await getCountyFromCoordinates(lng, lat);
            if (county) {
              document.getElementById("project_county").value = county;
              const countyDisplay = document.getElementById("selectedCounty");
              if (countyDisplay) {
                countyDisplay.textContent = county;
              }
            }
          } catch (error) {
            console.error("Error getting county:", error);
          }

          // Update or create marker
          if (newProjectMarker) {
            newProjectMarker.setLngLat([lng, lat]);
          } else {
            const el = document.createElement("div");
            el.innerHTML = `<i class="fas fa-map-marker-alt" style="font-size: 28px; color: #3b82f6;"></i>`;
            el.style.cursor = "pointer";
            el.style.filter = "drop-shadow(0 2px 4px rgba(0,0,0,0.3))";

            newProjectMarker = new mapboxgl.Marker(el)
              .setLngLat([lng, lat])
              .addTo(newProjectMap);
          }
        });

        console.log("New project map initialized successfully");
      } catch (error) {
        console.error("Error initializing new project map:", error);
      }
    }

    // Handle theme selection
    document.addEventListener("DOMContentLoaded", function () {
      // Theme selection logic
      const themeSelectAll = document.getElementById("theme_select_all");
      const themeCheckboxes = document.querySelectorAll(
        'input[name="theme[]"]'
      );
      const selectedThemesCount = document.getElementById(
        "selected-themes-count"
      );

      function updateThemeCounter() {
        if (selectedThemesCount) {
          const checkedCount = document.querySelectorAll(
            'input[name="theme[]"]:checked'
          ).length;
          selectedThemesCount.textContent = checkedCount;
        }
      }

      // Handle "Select All" checkbox
      if (themeSelectAll) {
        themeSelectAll.addEventListener("change", function () {
          themeCheckboxes.forEach((checkbox) => {
            checkbox.checked = this.checked;
          });
          updateThemeCounter();
        });
      }

      // Handle individual theme checkboxes
      themeCheckboxes.forEach((checkbox) => {
        checkbox.addEventListener("change", function () {
          const allChecked = Array.from(themeCheckboxes).every(
            (cb) => cb.checked
          );
          const noneChecked = Array.from(themeCheckboxes).every(
            (cb) => !cb.checked
          );

          if (themeSelectAll) {
            themeSelectAll.checked = allChecked;
            themeSelectAll.indeterminate = !allChecked && !noneChecked;
          }

          updateThemeCounter();
        });
      });

      // Initialize counter
      updateThemeCounter();
    });

    // Handle new project form submission
    const newProjectForm = document.getElementById("newProjectForm");
    if (newProjectForm) {
      newProjectForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        // Validate required fields by checking form data directly
        const form = e.target;
        const formDataObj = new FormData(form);

        // Collect multiple themes
        const selectedThemes = formDataObj.getAll("theme[]");

        const requiredFormFields = [
          { field: "title", label: "Title" },
          { field: "start_date", label: "Start Date" },
          { field: "activity_type", label: "Activity Type" },
          { field: "contact_person_name", label: "Contact Person Name" },
          { field: "contact_person_role", label: "Contact Person Role" },
          { field: "contact_person_mail", label: "Contact Person Email" },
          { field: "gaps", label: "Objectives" },
          { field: "budget", label: "Budget" },
          { field: "category", label: "Project Category" },
        ];

        const missingFields = requiredFormFields.filter((fieldObj) => {
          const value = formDataObj.get(fieldObj.field);
          return !value || value.trim() === "";
        });

        // Check for at least one theme
        if (selectedThemes.length === 0) {
          missingFields.push({
            field: "theme",
            label: "At least one Project Theme",
          });
        }

        // Check for at least one location (latitude/longitude from map selection)
        const latitude = document.getElementById("project_latitude")?.value;
        const longitude = document.getElementById("project_longitude")?.value;
        if (!latitude || !longitude) {
          missingFields.push({
            field: "location",
            label: "Project Location (click on map)",
          });
        }

        if (missingFields.length > 0) {
          const missingLabels = missingFields.map((f) => f.label);
          await showAlert(
            `Please fill in all required fields:\n• ${missingLabels.join(
              "\n• "
            )}`,
            "Validation Error",
            "warning"
          );

          // Focus on the first missing field
          const firstMissingField = form.querySelector(
            `[name="${missingFields[0].field}"]`
          );
          if (firstMissingField) {
            firstMissingField.focus();
            firstMissingField.scrollIntoView({
              behavior: "smooth",
              block: "center",
            });
          }
          return;
        }

        // Get location data
        const county = document.getElementById("project_county").value;
        const subCounty = document.getElementById("project_subcounty").value;

        // Prepare form data according to API documentation
        const formData = {
          partner: "TBD", // This should come from user's organization
          title: formDataObj.get("title"),
          themes: selectedThemes,
          projectCategory: formDataObj.get("category"),
          startDate: formDataObj.get("start_date"),
          endDate: formDataObj.get("end_date") || null,
          activityType: formDataObj.get("activity_type"),
          locations: [
            {
              county: county,
              subCounty: subCounty || null,
              latitude: parseFloat(latitude),
              longitude: parseFloat(longitude),
              mapsAddress: `${county}${subCounty ? ", " + subCounty : ""
                }, Kenya`.trim(),
            },
          ],
          contactPersonName: formDataObj.get("contact_person_name"),
          contactPersonRole: formDataObj.get("contact_person_role"),
          contactPersonEmail: formDataObj.get("contact_person_mail"),
          objectives: formDataObj.get("gaps"),
          budget: parseFloat(formDataObj.get("budget")),
          isPriority: true,
        };

        try {
          // Get current user to set partner
          const user = await authManager.getCurrentUser();
          console.log("Current user data:", user);

          // Try multiple sources for organization name
          if (user) {
            if (user.organization && user.organization.name) {
              formData.partner = user.organization.name;
              console.log(
                "Partner set from user.organization.name:",
                formData.partner
              );
            } else if (user.organizationName) {
              formData.partner = user.organizationName;
              console.log(
                "Partner set from user.organizationName:",
                formData.partner
              );
            } else if (user.name) {
              // Fallback to user's name if no organization
              formData.partner = user.organization.name;
              console.log(
                "Partner set from user.name (fallback):",
                formData.partner
              );
            }
          }

          console.log("📡 Submitting priority project to API...");
          console.log(
            "📦 Final project data being sent:",
            JSON.stringify(formData, null, 2)
          );

          // Submit to API using authManager
          const response = await authManager.apiCall(
            "/api/projects",
            "POST",
            formData
          );

          if (response.ok) {
            const result = await response.json();
            console.log("✅ Priority project created successfully:", result);

            // Extract project number from response
            const projectNumber = result.data?.projectNo || result.projectNo || 'N/A';

            // Show success message with project number and copy option
            const projectNumberHtml = `
                <div class="text-center">
                  <p class="text-lg mb-4">Your priority project has been created successfully!</p>
                  <div class="bg-blue-50 border-2 border-blue-300 rounded-lg p-4 mb-4">
                    <p class="text-sm text-gray-600 mb-2">Your Project Number:</p>
                    <p class="text-2xl font-bold text-blue-700" id="projectNumberDisplay">${projectNumber}</p>
                  </div>
                  <button onclick="navigator.clipboard.writeText('${projectNumber}').then(() => alert('Project number copied to clipboard!'))" 
                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
                    <i class="fas fa-copy mr-2"></i>Copy Project Number
                  </button>
                  <p class="text-sm text-gray-600 mt-4">⚠️ Please save this project number for future reference.</p>
                </div>
              `;

            await showAlert(
              projectNumberHtml,
              "Priority Project Created Successfully!",
              "success"
            );

            // Close modal
            const modal = document.getElementById("createNewProject");
            modal.classList.add("hidden");

            // Reset form
            document.getElementById("newProjectForm").reset();
            document.getElementById("selectedLatLng").textContent =
              "Click on map to select location";
            document.getElementById("selectedCounty").textContent = "";

            // Remove marker
            if (newProjectMarker) {
              newProjectMarker.remove();
              newProjectMarker = null;
            }

            // Refresh projects list
            loadProjectsForMap();
          } else {
            let errorMessage = "Failed to create priority project";
            // Use stored raw error text from authManager.apiCall if available
            const errorText = response.errorText || "";
            if (errorText) console.error("❌ Raw error response:", errorText);
            // Attempt to parse JSON error
            try {
              const errorData = JSON.parse(errorText);
              errorMessage = errorData.message || errorMessage;
              console.error("❌ API Error:", errorData);
            } catch (_e) {
              // Not JSON, skip
            }
            await showAlert(
              `Failed to create priority project: ${errorMessage}`,
              "Error",
              "error"
            );
          }
        } catch (error) {
          console.error("❌ Submission error:", error);
          await showAlert(
            "An error occurred while creating the priority project. Please try again.",
            "Error",
            "error"
          );
        }
      });
    }

    // Initialize new project modal when it's shown
    document.addEventListener("DOMContentLoaded", function () {
      // Listen for modal show events using TW Elements
      const modal = document.getElementById("createNewProject");

      // Use a more reliable approach: check when modal becomes visible
      const checkModalVisibility = () => {
        if (!modal.classList.contains("hidden") && !newProjectMap) {
          setTimeout(initializeNewProjectMap, 200);
        }
      };

      // Clean up map when modal is hidden
      const cleanupMap = () => {
        if (modal && modal.classList.contains("hidden") && newProjectMap) {
          newProjectMap.remove();
          newProjectMap = null;
          if (newProjectMarker) {
            newProjectMarker.remove();
            newProjectMarker = null;
          }
          // Reset display
          const latLngDisplay = document.getElementById("selectedLatLng");
          if (latLngDisplay) {
            latLngDisplay.textContent = "Click on map to select location";
          }
          const countyDisplay = document.getElementById("selectedCounty");
          if (countyDisplay) {
            countyDisplay.textContent = "";
          }
        }
      };

      // Check when modal visibility changes
      if (modal && modal instanceof Element) {
        try {
          const observer = new MutationObserver(() => {
            checkModalVisibility();
            cleanupMap();
          });
          observer.observe(modal, {
            attributes: true,
            attributeFilter: ["class"],
          });
        } catch (e) {
          console.warn('[priorities.html] Failed to observe modal:', e);
        }
      }

      // Also check on button click as backup
      const createButton = document.querySelector(
        '[data-twe-target="#createNewProject"]'
      );
      if (createButton) {
        createButton.addEventListener("click", () => {
          setTimeout(checkModalVisibility, 300);
        });
      }
    });

    // Function to open the new project modal (keeping for compatibility)
    function openNewProjectModal() {
      const modal = document.getElementById("createNewProject");
      modal.classList.remove("hidden");
      // Initialize map when modal opens
      setTimeout(initializeNewProjectMap, 100);
    }

    // Function to request collaboration on a project
    async function requestCollaboration(projectId) {
      const confirmed = await showConfirm(
        "Are you sure you want to request collaboration on this project?",
        "Request Collaboration",
        "Yes, Request",
        "Cancel"
      );
      if (!confirmed) {
        return;
      }

      try {
        const token = authManager.getToken();
        if (!token) {
          await showAlert(
            "You must be logged in to request collaboration.",
            "Authentication Required",
            "warning"
          );
          return;
        }

        // Get current user email
        const user = authManager.getCachedUser();
        if (!user || !user.email) {
          await showAlert(
            "Unable to retrieve user information. Please log in again.",
            "Error",
            "error"
          );
          return;
        }

        // Send as query parameters, not JSON body
        const response = await fetch(
          `${window.BASE_URL}/api/projects/${projectId}/collaborators?collaboratorEmail=${encodeURIComponent(user.email)}&role=EDITOR`,
          {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
            },
          }
        );

        if (response.ok) {
          const result = await response.json();
          await showAlert(
            "Collaboration request sent successfully!",
            "Success",
            "success"
          );
        } else {
          const error = await response.json();
          await showAlert(
            `Failed to request collaboration: ${error.message || "Unknown error"
            }`,
            "Error",
            "error"
          );
        }
      } catch (error) {
        console.error("Error requesting collaboration:", error);
        await showAlert(
          "An error occurred while requesting collaboration. Please try again.",
          "Error",
          "error"
        );
      }
    }

    // Load project statistics for counters
    async function loadProjectStatistics() {
      try {
        const response = await authManager.apiCall(
          "/api/projects/statistics",
          "GET"
        );
        if (!response || !response.ok) {
          console.error("Failed to fetch statistics, using defaults");
          useDefaultStatistics();
          return;
        }

        const stats = await response.json();
        console.log("[DEBUG] Statistics loaded:", stats);

        // Calculate statistics from the API response
        if (stats.data) {
          const data = stats.data;

          // Calculate total budget and active projects by fetching all projects
          let totalBudget = 0;
          let activeProjects = [];
          let regions = 0;
          let locations = 0;
          let projects = 0;
          try {
            const projectsResponse = await authManager.apiCall(
              "/api/projects?page=0&size=1000&sortBy=id&sortDir=desc",
              "GET"
            );
            if (projectsResponse.ok) {
              const projectsData = await projectsResponse.json();
              if (
                projectsData.status === 200 &&
                projectsData.data &&
                projectsData.data.projects
              ) {
                const allProjects = projectsData.data.projects;
                activeProjects = allProjects.filter(p => p.status?.toLowerCase() === 'active');
                projects = activeProjects.length;
                console.log("[DEBUG] Active projects count:", projects);
                totalBudget = activeProjects.reduce((sum, project) => {
                  return sum + (project.budget || 0);
                }, 0);
                // Calculate unique counties from active projects
                const countySet = new Set();
                activeProjects.forEach(p => {
                  if (p.county) countySet.add(p.county);
                });
                regions = countySet.size;
                console.log("[DEBUG] Unique counties set:", Array.from(countySet));
                console.log("[DEBUG] Regions count:", regions);
                // Calculate projects with coordinates from statistics API
                locations = data.projectsWithCoordinates || locations;
                console.log(
                  "[DEBUG] Active projects:", projects,
                  "Regions:", regions,
                  "Locations:", locations,
                  "Total budget:", totalBudget
                );
              }
            }
          } catch (budgetError) {
            console.error(
              "Error fetching projects for statistics calculation:",
              budgetError
            );
            // Fallback to API stats
            regions = data.countyCounts ? data.countyCounts.length : 0;
            locations = data.projectsWithCoordinates || data.totalProjects || 0;
            projects = 0;
            totalBudget = 0;
          }

          // Calculate stakeholders count (PARTNERS and DONORS only)
          let stakeholdersCount = 0;
          try {
            console.log("[DEBUG] Loading user statistics for stakeholders count...");
            const usersResponse = await fetch(
              `${window.BASE_URL}/api/auth/admin/users`,
              {
                headers: {
                  Authorization: `Bearer ${authManager.getToken()}`,
                },
              }
            );

            if (usersResponse.ok) {
              const usersData = await usersResponse.json();
              console.log("[DEBUG] Users API response status:", usersResponse.status);
              console.log("[DEBUG] Users data loaded:", usersData);
              console.log("[DEBUG] Users data structure:", {
                hasData: !!usersData.data,
                isArray: Array.isArray(usersData.data),
                dataLength: usersData.data?.length,
              });

              if (usersData.data && Array.isArray(usersData.data)) {
                const totalUsers = usersData.data.length;

                // Debug: Log all unique roles and organization types
                const roles = [...new Set(usersData.data.map((u) => u.role))];
                const orgTypes = [
                  ...new Set(
                    usersData.data
                      .map((u) => u.organization?.organizationType)
                      .filter(Boolean)
                  ),
                ];
                console.log("[DEBUG] Available user roles:", roles);
                console.log("[DEBUG] Available organization types:", orgTypes);
                console.log(
                  "[DEBUG] Sample user data:",
                  usersData.data.slice(0, 3)
                );

                // Calculate stakeholders as users with PARTNER or DONOR roles
                const stakeholders = usersData.data.filter((user) => {
                  return user.role === "PARTNER" || user.role === "DONOR";
                }).length;
                console.log("[DEBUG] Stakeholders calculation:", {
                  totalUsers,
                  stakeholders,
                  partnerCount: usersData.data.filter((u) => u.role === "PARTNER")
                    .length,
                  donorCount: usersData.data.filter((u) => u.role === "DONOR")
                    .length,
                  filteredStakeholders: usersData.data
                    .filter((user) => user.role === "PARTNER" || user.role === "DONOR")
                    .map((u) => ({
                      id: u.id,
                      role: u.role,
                      orgType:
                        u.organization?.organizationType || u.organization?.type,
                    })),
                });
                stakeholdersCount = stakeholders;
                console.log("[DEBUG] Final stakeholders count (PARTNERS+DONORS):", stakeholdersCount);
              }
            } else {
              console.warn(
                "[DEBUG] Failed to load user statistics, keeping default stakeholders count of 0"
              );
            }
          } catch (userError) {
            console.error("Error fetching users for stakeholders count:", userError);
            stakeholdersCount = 0;
          }

          // Store the statistics in a global variable
          window.statsData = {
            locations: locations,
            projects: projects,
            regions: regions,
            users: stakeholdersCount,
            amount: totalBudget,
          };

          console.log("[DEBUG] Calculated statsData:", window.statsData);

          // Update the hero statistics display with the actual data
          updateStatisticsDisplay(data);
        } else {
          console.warn("[DEBUG] No stats.data found, using defaults");
          useDefaultStatistics();
        }
      } catch (error) {
        console.error("Error loading statistics:", error);
        useDefaultStatistics();
      }
    }

    function updateStatisticsDisplay(stats) {
      console.log("📊 Updating statistics display with:", stats);

      // Use calculated statsData instead of API stats
      const calculatedStats = window.statsData || {};

      // Update hero section statistics
      const totalProjectsElement =
        document.getElementById("totalProjectsCount");
      const totalCountiesElement =
        document.getElementById("totalCountiesCount");
      const totalStakeholdersElement = document.getElementById(
        "totalStakeholdersCount"
      );

      // Calculate counties count - handle both array and object formats
      let countiesCount = 0;
      if (stats.countyCounts) {
        if (Array.isArray(stats.countyCounts)) {
          countiesCount = stats.countyCounts.length;
        } else if (typeof stats.countyCounts === "object") {
          countiesCount = Object.keys(stats.countyCounts).length;
        }
      }

      if (totalProjectsElement) {
        const projectCount = calculatedStats.projects || 0;
        totalProjectsElement.textContent = projectCount;
        console.log("✅ Updated total projects count:", projectCount);
      } else {
        console.warn("⚠️ totalProjectsElement not found");
      }

      if (totalCountiesElement) {
        const counties = calculatedStats.regions || countiesCount;
        totalCountiesElement.textContent = counties;
        console.log("✅ Updated total counties count:", counties);
      } else {
        console.warn("⚠️ totalCountiesElement not found");
      }

      if (totalStakeholdersElement) {
        const stakeholdersCount = calculatedStats.users || stats.totalStakeholders || 0;
        totalStakeholdersElement.textContent = stakeholdersCount;
        console.log(
          "✅ Updated total stakeholders count:",
          stakeholdersCount
        );
      } else {
        console.warn("⚠️ totalStakeholdersElement not found");
      }

      console.log("📊 Hero statistics updated:", {
        projects: calculatedStats.projects,
        counties: calculatedStats.regions,
        stakeholders: calculatedStats.users,
      });
    }

    function useDefaultStatistics() {
      console.log("[DEBUG] Using default statistics");
      window.statsData = {
        locations: 0,
        projects: 0,
        regions: 0,
        users: 0,
        amount: 0,
      };
      updateStatisticsDisplay({
        totalProjects: 0,
        countyCounts: [],
        totalStakeholders: 0,
      });
    }
  </script>
